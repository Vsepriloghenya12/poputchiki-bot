<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f66d6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Попутчики" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Попутчики</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body class="app-page">
  <div class="app-shell">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-card">
        <div class="drawer-user">
          <div class="small muted">Ваш профиль</div>
          <div class="person-name" id="drawerUserName">Попутчики</div>
          <div class="person-meta muted" id="drawerUserTag">Мини-приложение для поездок</div>
        </div>
        <nav class="drawer-nav">
          <button class="drawer-link is-active" type="button" data-view="feed">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v3H4V6zm0 5h16v3H4v-3zm0 5h16v3H4v-3z"/></svg>
            Лента
          </button>
          <button class="drawer-link" type="button" data-view="history">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.95 10h-2.02A7 7 0 1 1 13 5v4l5-5-5-5v4zm-1 5h2v6h-5v-2h3V8z"/></svg>
            Моя история
          </button>
          <button class="drawer-link" type="button" id="installAppBtn">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 7 8h3v6h4V8h3l-5-5zm-7 12h3v4h8v-4h3v6H5v-6z"/></svg>
            <span id="installAppLabel">Установить приложение</span>
          </button>
          <button class="drawer-link" type="button" id="pushToggleBtn">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm6-6v-5a6 6 0 1 0-12 0v5L4 18v1h16v-1l-2-2z"/></svg>
            <span id="pushToggleLabel">Включить уведомления</span>
          </button>
        </nav>
      </div>
    </aside>

    <div class="sheet-backdrop" id="sheetBackdrop">
      <section class="sheet">
        <div class="sheet-head">
          <div>
            <h2 class="sheet-title" id="composerTitle">Создать поездку</h2>
            <p class="sheet-subtitle" id="composerSubtitle">Новая запись сразу появится в ленте.</p>
          </div>
          <button class="icon-btn close" type="button" id="closeComposerBtn" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
          </button>
        </div>
        <form class="form-grid" id="composerForm">
          <div class="field">
            <label for="composerFrom">Откуда</label>
            <input class="input" id="composerFrom" type="text" placeholder="Например: Москва" required />
          </div>
          <div class="field">
            <label for="composerTo">Куда</label>
            <input class="input" id="composerTo" type="text" placeholder="Например: Тула" required />
          </div>
          <div class="field">
            <label for="composerDatetime">Дата и время</label>
            <input class="input" id="composerDatetime" type="datetime-local" required />
          </div>
          <div class="form-grid two-col">
            <div class="field">
              <label for="composerSeats" id="composerSeatsLabel">Свободных мест</label>
              <input class="input" id="composerSeats" type="number" min="1" max="8" value="1" required />
            </div>
            <div class="field">
              <label for="composerPrice" id="composerPriceLabel">Цена за место</label>
              <input class="input" id="composerPrice" type="number" min="0" step="10" value="0" required />
            </div>
          </div>
          <div class="field">
            <label for="composerNote">Комментарий</label>
            <textarea class="textarea" id="composerNote" placeholder="Коротко: где забрать, есть ли багаж, удобный диапазон времени"></textarea>
          </div>
          <button class="button is-block" type="submit" id="composerSubmit">Создать поездку</button>
        </form>
      </section>
    </div>

    <div class="sheet-backdrop" id="filterBackdrop">
      <section class="sheet sheet--filters">
        <div class="sheet-head">
          <div>
            <h2 class="sheet-title">Фильтры поиска</h2>
            <p class="sheet-subtitle">Откуда, дата, время и количество мест.</p>
          </div>
          <button class="icon-btn close" type="button" id="closeFilterBtn" aria-label="Закрыть фильтры">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
          </button>
        </div>
        <form class="form-grid" id="filterForm">
          <div class="field">
            <label for="filterFrom">Откуда</label>
            <input class="input" id="filterFrom" type="text" placeholder="Например: Анапа" />
          </div>
          <div class="form-grid two-col">
            <div class="field">
              <label for="filterDate">Дата</label>
              <input class="input" id="filterDate" type="date" />
            </div>
            <div class="field">
              <label for="filterTime">Время</label>
              <input class="input" id="filterTime" type="time" />
            </div>
          </div>
          <div class="field">
            <label for="filterSeats">Количество мест</label>
            <input class="input" id="filterSeats" type="number" min="1" max="8" placeholder="Например: 2" />
          </div>
          <div class="sheet-actions">
            <button class="ghost-button" type="button" id="clearFilterBtn">Сбросить</button>
            <button class="button" type="submit">Показать</button>
          </div>
        </form>
      </section>
    </div>

    <div class="screen">
      <header class="topbar">
        <button class="icon-btn" type="button" id="menuBtn" aria-label="Открыть меню">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2.4H4V6zm0 4.8h16v2.4H4v-2.4zm0 4.8h16V18H4v-2.4z"/></svg>
        </button>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 11h14l-1.1-3.1A3 3 0 0 0 15 6H9a3 3 0 0 0-2.9 1.9L5 11zm-.5 1.5A2.5 2.5 0 0 0 2 15v2.5A1.5 1.5 0 0 0 3.5 19H5a2 2 0 1 0 4 0h6a2 2 0 1 0 4 0h1.5A1.5 1.5 0 0 0 22 17.5V15a2.5 2.5 0 0 0-2.5-2.5h-15z"/></svg>
          </div>
          <div class="brand-title">Попутчики</div>
        </div>
        <button class="icon-btn primary" type="button" id="createBtn" aria-label="Создать">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v14h-2zM5 11h14v2H5z"/></svg>
        </button>
      </header>

      <section class="tabs-panel" id="tabsPanel">
        <button class="tab-btn is-active" id="feedDriverBtn" type="button">Поездки водителей</button>
        <button class="tab-btn" id="feedPlansBtn" type="button">Заявки пассажиров</button>
      </section>

      <main class="page-body">
        <section class="status-banner hidden" id="statusBanner"></section>

        <section class="view is-active" id="viewFeed">
          <div class="cards-stack" id="feedList"></div>
        </section>

        <section class="view" id="viewActive">
          <section class="plain-section">
            <div class="section-label">Я водитель</div>
            <div class="cards-stack" id="activeDriverTripList"></div>
            <div class="block-list" id="activeDriverBookingsList"></div>
          </section>

          <section class="plain-section">
            <div class="section-label">Я пассажир</div>
            <div class="cards-stack" id="activePassengerBookingsList"></div>
          </section>

          <section class="plain-section">
            <div class="section-label">Забранные заявки</div>
            <div class="cards-stack" id="activeTakenPlansList"></div>
          </section>
        </section>

        <section class="view" id="viewHistory">
          <section class="plain-section">
            <div class="section-label">История водителя</div>
            <div class="cards-stack" id="historyDriverTripsList"></div>
          </section>

          <section class="plain-section">
            <div class="section-label">Мои бронирования</div>
            <div class="cards-stack" id="historyPassengerBookingsList"></div>
          </section>

          <section class="plain-section">
            <div class="section-label">Мои заявки</div>
            <div class="cards-stack" id="historyPassengerPlansList"></div>
          </section>

          <section class="plain-section">
            <div class="section-label">Забранные заявки</div>
            <div class="cards-stack" id="historyTakenPlansList"></div>
          </section>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="bottom-nav__item is-active" id="bottomSearchBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4.06 11.57l4.43 4.43 1.41-1.41-4.43-4.43A6.5 6.5 0 0 0 10.5 4zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
          <span>Поиск</span>
        </button>
        <button class="bottom-nav__item" id="bottomActiveBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v6c0 5 3.8 8.7 9 9 5.2-.3 9-4 9-9V7l-9-5zm-1 13-4-4 1.4-1.4L11 12.2l4.6-4.6L17 9l-6 6z"/></svg>
          <span>Активные</span>
        </button>
        <button class="bottom-nav__item" id="bottomInstallBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 7 8h3v6h4V8h3l-5-5zm-7 12h3v4h8v-4h3v6H5v-6z"/></svg>
          <span id="bottomInstallLabel">Установить</span>
        </button>
      </nav>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
